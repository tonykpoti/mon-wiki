site_name: Wiki Tony KPOTI
site_url: https://tonykpoti.github.io/mon-wiki/
site_description: Documentation personnelle DBA Oracle & PostgreSQL
site_author: Antoine Koffi KPOTI

theme:
  name: material
  language: fr
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Accueil: index.md
  - Oracle:
    - Data Guard 19c: oracle/oracle-dataguard-19c-eliora.md
  - PostgreSQL:
    - Introduction: postgresql/index.md
  - Linux:
    - Oracle Linux 8: linux/oracle-linux-8.md
  - Projets:
    - Maison KPOTI App: projets/maison-kpoti-app.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  
